# The Xcode project is made from this file by XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   brew install xcodegen && xcodegen generate && open CashCraft.xcodeproj
name: CashCraft
options:
  bundleIdPrefix: it.mauromazzieri
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CashCraft:
    type: application
    platform: iOS
    sources:
      - path: CashCraft
    preBuildScripts:
      - name: Build cashcraft-ffi
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.mauromazzieri.cashcraft
        SWIFT_OBJC_BRIDGING_HEADER: CashCraft/CashCraft-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/rust/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lcashcraft_ffi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # The script runs cargo, which writes in the repository's target folder.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: CashCraft/Info.plist
      properties:
        CFBundleDisplayName: CashCraft
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
