# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} and exports VERSION, NFPM_ARCH and GLIBC_FLOOR.
# Adapted from storytold/craft-launcher (packaging/linux/nfpm.yaml, MIT OR Apache-2.0).
name: cashcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: utils
priority: optional
maintainer: Mauro Mazzieri <https://github.com/mmazzieri>
vendor: Mauro Mazzieri
homepage: https://github.com/mmazzieri/CashCraft
license: MIT OR Apache-2.0
description: |-
  Personal finance with bank statement import.
  CashCraft keeps accounts, transactions, budgets and reports in one
  file on this computer, imports bank CSV statements, and can be driven
  from the command line or by an AI agent (MCP). Local, offline, no account.

# The binary links only glibc and libgcc_s directly; windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are listed by hand.
overrides:
  deb:
    depends:
      - libc6 (>= ${GLIBC_FLOOR})
      - libgcc-s1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libvulkan1 | libegl1
    recommends:
      - mesa-vulkan-drivers
      - libegl-mesa0
      - xdg-desktop-portal
  rpm:
    depends:
      - glibc >= ${GLIBC_FLOOR}
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/cashcraft
    dst: /usr/bin/cashcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/cashcraft-cli
    dst: /usr/bin/cashcraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
