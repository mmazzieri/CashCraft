[package]
name = "cashcraft-engine"
description = "CashCraft data file, bank CSV import and operations"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# PDF files for the tests of other crates.
test-support = ["dep:flate2"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
craft-xls.workspace = true
csv.workspace = true
encoding_rs.workspace = true
flate2 = { workspace = true, optional = true }
hayro-interpret.workspace = true
hayro-syntax.workspace = true
kurbo.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sys-locale.workspace = true

[dev-dependencies]
craft-xls = { workspace = true, features = ["test-support"] }
epaint_default_fonts = "0.37"
flate2.workspace = true
