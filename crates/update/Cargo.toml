[package]
name = "cashcraft-update"
description = "A copy that updates itself from the project's GitHub releases, checked by their own signature"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# No network of its own in the browser (whose build would bring bundled root certificates).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls-native-certs.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
winreg.workspace = true
