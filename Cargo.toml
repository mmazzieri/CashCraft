[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/mmazzieri/CashCraft"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "warn"
wildcard_imports = "deny"
dbg_macro = "warn"

[workspace.dependencies]
cashcraft-engine = { path = "crates/engine" }
cashcraft-icon = { path = "crates/icon" }
cashcraft-ui-egui = { path = "crates/ui-egui" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
craft-xls = { git = "https://github.com/storytold/craft-libs", rev = "249a41bd9306a1b34330ac94e596a1a8b881378a", version = "=0.1.0" }
csv = "1.3"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
flate2 = "1"
hayro-interpret = { version = "=0.7.0", default-features = false }
hayro-syntax = { version = "=0.7.2", default-features = false }
kurbo = "0.13"
regex = "1.13"
sha2 = "0.10"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
