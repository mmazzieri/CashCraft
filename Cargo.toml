[package]
name = "cashcraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "CashCraft: personal finance with Italian bank CSV import, a CLI and an MCP server. An open-source, clean-room app in pure Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmazzieri/cashcraft"
readme = "README.md"
keywords = ["finance", "budget", "csv", "mcp", "egui"]
categories = ["finance", "gui", "command-line-utilities"]
default-run = "cashcraft"

[lib]
name = "cashcraft"
path = "src/lib.rs"

[[bin]]
name = "cashcraft"
path = "src/main.rs"

[[bin]]
name = "cashcraft-cli"
path = "src/bin/cashcraft-cli.rs"

[dependencies]
eframe = "0.37"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
encoding_rs = "0.8"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

# Installers for Windows (.msi) and Linux (.deb, .AppImage) via cargo-packager;
# macOS is packaged by packaging/macos/package.sh (universal .app + .dmg).
[package.metadata.packager]
product-name = "CashCraft"
identifier = "io.github.mmazzieri.cashcraft"
publisher = "CashCraft contributors"
category = "Finance"
description = "Personal finance with Italian bank CSV import, CLI and MCP"
before-packaging-command = "cargo build --release --bins"
out-dir = "target/packager"
icons = ["assets/icons/32x32.png", "assets/icons/128x128.png", "assets/icons/256x256.png", "assets/icons/icon.ico"]
binaries = [{ path = "cashcraft", main = true }, { path = "cashcraft-cli", main = false }]

[package.metadata.packager.deb]
section = "utils"
