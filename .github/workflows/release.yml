name: Release

# A tag vX.Y.Z builds every package and opens a draft GitHub release with them and
# SHA256SUMS.txt; the release is published by hand. A pull request that touches the
# packaging builds the same packages without releasing anything, so they are tested
# before a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "assets/app-icon/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04: glibc 2.35, so the binaries run on newer distros.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install nfpm and rpm
        run: |
          set -euo pipefail
          case "$(dpkg --print-architecture)" in
            amd64) sha=45650c5f6109685436fa6ba91958eb93e09a899bb0d65dd5b7c3c66020c056d2 ;;
            arm64) sha=f6c77951e74a267fade0c6a14fa66eee35a750cd23da483e39d2e92a6b307527 ;;
          esac
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_$(dpkg --print-architecture).deb"
          echo "$sha  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y rpm "$RUNNER_TEMP/nfpm.deb"
      - run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          set -eux
          ls -l dist/release
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/cashcraft|applications/'
          rpm -qip dist/release/*.rpm
          tar -tzf dist/release/*.tar.gz | grep -E 'bin/cashcraft(-cli)?$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Import the signing certificate (skipped without secrets)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      # Windows signing (SSL.com eSigner) runs only when its secrets are set, and never for pull requests.
      SIGN: ${{ github.event_name != 'pull_request' && secrets.ES_USERNAME != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and check the programs
        run: pwsh packaging/windows/package.ps1 -BuildOnly
      - name: Sign the app (skipped without the signing secrets)
        if: env.SIGN == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/cashcraft.exe
          override: true
          malware_block: false
      - name: Sign the command line (skipped without the signing secrets)
        if: env.SIGN == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/cashcraft-cli.exe
          override: true
          malware_block: false
      - name: Package
        run: pwsh packaging/windows/package.ps1 -SkipBuild
      - name: Find the installer
        id: msi
        shell: pwsh
        run: |
          "path=$((Get-ChildItem dist/release/*.msi).FullName)" >> $env:GITHUB_OUTPUT
      - name: Sign the installer (skipped without the signing secrets)
        if: env.SIGN == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ steps.msi.outputs.path }}
          override: true
          malware_block: false
      - name: Check the signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = @('${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/cashcraft.exe', '${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/cashcraft-cli.exe', '${{ steps.msi.outputs.path }}')
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$f is not validly signed: $($sig.Status) $($sig.StatusMessage)" }
            Write-Output "$f signed by $($sig.SignerCertificate.Subject)"
          }
      - name: Check the MSI installs and removes cleanly (per user)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/release/*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', 'ALLUSERS=2', 'MSIINSTALLPERUSER=1', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\CashCraft\cashcraft.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $cli = Join-Path (Split-Path $exe) 'cashcraft-cli.exe'
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "cashcraft-cli does not run" }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "CashCraft ${GITHUB_REF_NAME#v}" --generate-notes
