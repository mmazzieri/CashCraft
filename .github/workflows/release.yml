name: Release

# A tag vX.Y.Z builds every package and opens a draft GitHub release with them,
# SHA256SUMS.txt and its signature SHA256SUMS.txt.sig (docs/updates.md); the release is published by hand. A pull request that touches the
# packaging builds the same packages without releasing anything, so they are tested
# before a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "assets/app-icon/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04: glibc 2.35, so the binaries run on newer distros.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install nfpm and rpm
        run: |
          set -euo pipefail
          case "$(dpkg --print-architecture)" in
            amd64) sha=45650c5f6109685436fa6ba91958eb93e09a899bb0d65dd5b7c3c66020c056d2 ;;
            arm64) sha=f6c77951e74a267fade0c6a14fa66eee35a750cd23da483e39d2e92a6b307527 ;;
          esac
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_$(dpkg --print-architecture).deb"
          echo "$sha  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y rpm "$RUNNER_TEMP/nfpm.deb"
      - run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          set -eux
          ls -l dist/release
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/cashcraft|applications/'
          rpm -qip dist/release/*.rpm
          tar -tzf dist/release/*.tar.gz | grep -E 'bin/cashcraft(-cli)?$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Import the signing certificate (skipped without secrets)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      APP_NAME: CashCraft
      SIGN: ${{ github.event_name != 'pull_request' && secrets.CERTUM_OTPAUTH != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and check the programs
        run: pwsh packaging/windows/package.ps1 -BuildOnly
      # Windows signing: Certum Open Source certificate in the cloud (SimplySign), signed in with the
      # account's TOTP. Runs only when the secrets are set, and never for pull requests.
      - name: Sign in to SimplySign (skipped without the signing secrets)
        if: env.SIGN == 'true'
        uses: TIANLI0/codesign@4d4b0a2902185764953a35ccf754f31e7179cbfb # v1, MIT
        with:
          email: ${{ secrets.CERTUM_EMAIL }}
          otpauth: ${{ secrets.CERTUM_OTPAUTH }}
          thumbprint: ${{ vars.CERTUM_THUMBPRINT }}
      - name: Sign the programs
        if: env.SIGN == 'true'
        uses: TIANLI0/codesign/sign@4d4b0a2902185764953a35ccf754f31e7179cbfb
        with:
          root: target/x86_64-pc-windows-msvc/release
          files: |
            cashcraft.exe
            cashcraft-cli.exe
          description: ${{ env.APP_NAME }}
          description-url: https://github.com/${{ github.repository }}
      - name: Package
        run: pwsh packaging/windows/package.ps1 -SkipBuild
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: TIANLI0/codesign/sign@4d4b0a2902185764953a35ccf754f31e7179cbfb
        with:
          root: dist/release
          files: '*.msi'
          description: ${{ env.APP_NAME }}
          description-url: https://github.com/${{ github.repository }}
      - name: Sign out of SimplySign
        if: always() && env.SIGN == 'true'
        uses: TIANLI0/codesign/logout@4d4b0a2902185764953a35ccf754f31e7179cbfb
      - name: Check the MSI installs and removes cleanly (per user)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/release/*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', 'ALLUSERS=2', 'MSIINSTALLPERUSER=1', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\CashCraft\cashcraft.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $cli = Join-Path (Split-Path $exe) 'cashcraft-cli.exe'
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "cashcraft-cli does not run" }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # The copies that update themselves take a release only by this signature (docs/updates.md).
      # Without the secret the release is unsigned: it is told of, and never installed by itself.
      - name: Sign the checksums (skipped without the key)
        working-directory: dist
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set: the release is not signed and no copy installs it by itself"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key" "$RUNNER_TEMP/sums.sig" "$RUNNER_TEMP/release-key.pub"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in SHA256SUMS.txt -out "$RUNNER_TEMP/sums.sig"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release-key.pub"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/release-key.pub" \
            -sigfile "$RUNNER_TEMP/sums.sig" -in SHA256SUMS.txt
          base64 -w0 "$RUNNER_TEMP/sums.sig" > SHA256SUMS.txt.sig
          echo >> SHA256SUMS.txt.sig
          echo "Signed by the key whose public half is:"
          openssl pkey -pubin -in "$RUNNER_TEMP/release-key.pub" -outform DER | tail -c 32 | base64
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "CashCraft ${GITHUB_REF_NAME#v}" --generate-notes
